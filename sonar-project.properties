# Project identity (unique within the local SonarQube instance)
sonar.projectKey=low-level-lab
sonar.projectName=low-level-lab
sonar.sourceEncoding=UTF-8

# Analyze application source only; dependencies and generated outputs are excluded.
sonar.sources=apps/api/src,apps/web/src,shared/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.wrangler/**,**/worker-configuration.d.ts
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.app.json,apps/web/tsconfig.worker.json

# When a test runner is added, generate coverage/lcov.info and uncomment this line.
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
