# Low-Level Lab — laptop / single-node infra (quick path)
# Home server & local clusters: use infra/k8s + Argo CD (see infra/README.md)
#
#   docker compose up -d
#   docker compose up -d postgres redis redis   # subset

name: low-level-lab

services:
  postgres:
    image: postgres:15
    container_name: llb-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lowlevellab
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lowlevellab"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - llb

  redis:
    image: redis:7-alpine
    container_name: llb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - llb

  kafka:
    image: apache/kafka:3.8.1
    container_name: llb-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    networks:
      - llb

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: llb-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - llb

  reactor:
    build:
      context: ./reactor/service
      dockerfile: Dockerfile
    container_name: llb-reactor
    ports:
      - "18080:18080"
    environment:
      PORT: "18080"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      CORS_ORIGIN: "*"
    depends_on:
      - redis
      - kafka
    networks:
      - llb

  minio:
    image: minio/minio:latest
    container_name: llb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - llb

  prometheus:
    image: prom/prometheus:latest
    container_name: llb-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - llb

  grafana:
    image: grafana/grafana:latest
    container_name: llb-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - llb

  loki:
    image: grafana/loki:latest
    container_name: llb-loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - llb

  tempo:
    image: grafana/tempo:latest
    container_name: llb-tempo
    command: -config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/tempo
    networks:
      - llb

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: llb-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/otel/config.yaml:/etc/otel/config.yaml:ro
    networks:
      - llb

networks:
  llb:

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
