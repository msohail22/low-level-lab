# /etc/systemd/zram-generator.conf
#
# Compressed swap in RAM. See learning.md Q63.
#
# WHY: arrakis was already swapping to the SSD before this existed - 447 MB in
# use on 2026-11-08 - because four VMs hold about 8273 MB of an 11690 MB host.
# A page read from the SSD is roughly 1000 times slower than one read from RAM.
# zram keeps those pages in memory, compressed, instead.
#
# SIZING: ram/4 on 11690 MB is about 2922 MB of device. At the 2:1 ratio the
# kernel docs expect, that holds roughly 5.8 GB of pages.
#
#   The kernel documentation: "There is little point creating a zram of greater
#   than twice the size of memory since we expect a 2:1 compression ratio."
#   zram-generator's own example: "Fractions in the range 0.1-0.5 are
#   recommended." ram/4 = 0.25.
#
# THE DEVICE IS NOT A RESERVATION. The kernel docs: "zram uses about 0.1% of the
# size of the disk when not in use". So an unused 2922 MB device costs about
# 3 MB. It only consumes memory as pages are written to it.
#
# COMPRESSION: zstd. It compresses better than lzo-rle at more CPU cost. That
# trade is right here because the four cores went idle when the nightly
# ClickHouse build was removed (D42), while memory is the binding limit (B11).
#
# ONE CHANGE AT A TIME: vm.swappiness is deliberately LEFT AT ITS DEFAULT of 60.
# Raising it would make the kernel swap more eagerly, which is usually right once
# swapping is cheap - but changing two things at once makes the measurement
# meaningless. Decide swappiness after this is measured.

[zram0]
zram-size = ram / 4
compression-algorithm = zstd
