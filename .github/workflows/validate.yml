name: validate

on:
  pull_request:
  # Fires when a PR enters a merge queue, if one is enabled. The queue builds
  # master + the PRs ahead + this one and runs the checks on that combination,
  # which is the only way two independently-green PRs get tested together.
  # Enabling the queue itself is a repository setting; this trigger is the half
  # that lives in a file.
  merge_group:
  push:
    branches: [master]

# A new push to a PR cancels the previous run, so the queue never backs up.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed for the up-to-date check below, which walks history.
          fetch-depth: 0

      # On a pull_request event GitHub checks out the merge of this branch with
      # the base, so every check below already sees master as it was when the
      # run started. What it cannot see is another PR merging afterwards: this
      # run stays green and its result is still honoured at merge time.
      #
      # Failing when the branch is behind closes that window. The author
      # rebases, CI re-runs against the combination, and a duplicate title
      # introduced by the other PR is caught.
      - name: Branch must be up to date with the base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if ! git merge-base --is-ancestor \
                "origin/${{ github.base_ref }}" \
                "${{ github.event.pull_request.head.sha }}"; then
            echo "::error::${{ github.base_ref }} has moved since this branch was last updated. Rebase or merge it in so the checks run against the combined result."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every question's frontmatter, required headings, required blocks and
      # tests file. This is the review: a question that breaks the contract
      # cannot merge, so nobody has to read the diff to catch it.
      - name: Validate questions
        run: pnpm validate

      # Parses every test case and rejects malformed JSON or duplicates.
      - name: Validate and chunk test cases
        run: pnpm build:tests

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # A question file must not reach master without being reachable, so fail
      # if someone commits the generated chunks instead of the source file.
      - name: Check generated files are not committed
        run: |
          if git ls-files --error-unmatch apps/web/public/tests >/dev/null 2>&1; then
            echo "::error::apps/web/public/tests is generated. Remove it from the commit."
            exit 1
          fi
          if git ls-files --error-unmatch CLAUDE.md >/dev/null 2>&1; then
            echo "::error::CLAUDE.md must stay untracked."
            exit 1
          fi

      # arrakis/ arrived from a repository where `tofu/*.tfstate` was anchored one
      # level too shallow, so `tofu/k8s/terraform.tfstate` — holding a plaintext
      # POSTGRES_PASSWORD and a Grafana admin password — was tracked, next to
      # 81 MB of provider binaries. State is never reviewable and a leaked
      # password cannot be un-pushed, so this is a check and not a note.
      - name: No Terraform state or provider binaries committed
        run: |
          bad=$(git ls-files \
            '*.tfstate' '*.tfstate.*' '*.tfvars' \
            '**/.terraform/**' '*.kubeconfig')
          if [ -n "$bad" ]; then
            echo "::error::Terraform state, tfvars or provider plugins are committed. These hold secrets. Remove them and add them to .gitignore unanchored (**/*.tfstate)."
            echo "$bad"
            exit 1
          fi
