# /etc/systemd/logind.conf.d/10-server-no-sleep.conf
#
# arrakis is a server, not a personal laptop. Ignore the lid.
#
# All three settings are needed. HandleLidSwitch alone covers battery power
# only; HandleLidSwitchExternalPower covers the charger, which is arrakis's
# normal state - and that one defaulted to the same `suspend`.
#
# CONSEQUENCE, recorded because it already bit once (learning.md Q21): the
# machine no longer suspends when the lid shuts, so an UNPLUGGED arrakis runs
# its battery to zero. It died that way on 2026-11-08, found at 2 percent.
# Keep it on mains. See blocker B7.
#
# Verify with busctl, NOT by reading this file back:
#   busctl get-property org.freedesktop.login1 /org/freedesktop/login1 \
#     org.freedesktop.login1.Manager HandleLidSwitch
# It must print: s "ignore"

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
