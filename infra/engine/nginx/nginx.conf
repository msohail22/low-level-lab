events {}

http {
  upstream hono_engine {
    server hono-engine.hono-engine.svc.cluster.local:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://hono_engine;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
